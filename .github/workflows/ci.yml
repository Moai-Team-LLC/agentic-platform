name: CI

on:
  push:
    branches: [main]
  pull_request:

# Submodules are NOT checked out anywhere in this workflow (vendor/ is heavy and
# unneeded for these checks) — every `actions/checkout` below relies on the
# `submodules: false` default.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: shell (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (bash -n)
        run: bash -n cli/agentic

      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: cli
          severity: warning
          # SC1090 — dynamic `. "$ENVF"` source, expected (env file path is
          #   computed at runtime by design).
          # SC2164 — `cd "$ROOT"` without `|| exit`; ROOT is derived from
          #   BASH_SOURCE right above, cd realistically can't fail here.
          # SC2155 — one declare+assign masking a return value in a non-critical
          #   local var.
          # None of these are correctness bugs in the current script; excluded so
          # CI stays green today while `-S warning` still fails on any new
          # warning-or-above finding (including these three codes elsewhere).
          additional_files: ""
        env:
          SHELLCHECK_OPTS: -e SC1090,SC2164,SC2155

  test:
    name: test (tests/run.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: |
          if [ -f tests/run.sh ]; then
            bash tests/run.sh
          else
            echo "tests/run.sh not found — skipping (no test suite yet)"
          fi

  console:
    name: console (bff typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        if: hashFiles('console/bff/package.json') != ''
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: hashFiles('console/bff/package.json') != ''
        working-directory: console/bff
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Type/compile check
        if: hashFiles('console/bff/package.json') != ''
        working-directory: console/bff
        run: |
          # No tsconfig.json is committed and no @types/{bun,node} are installed,
          # so a real `tsc --noEmit` has nothing to check against and fails on
          # every ambient global (Bun, process, node:fs...). Use `bun build` as
          # the practical compile check instead — it exercises Bun's own
          # TypeScript parser/resolver and catches syntax errors and unresolved
          # imports, which is the failure mode that actually matters here.
          if [ -f server.ts ]; then
            bun build server.ts --target bun --outdir /tmp/console-bff-build
          else
            echo "console/bff/server.ts not found — skipping"
          fi

      - name: Skip (no console/bff/package.json)
        if: hashFiles('console/bff/package.json') == ''
        run: echo "console/bff/package.json not found — skipping console job"

  compose:
    name: compose (config validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate temporary .env
        run: |
          sed "s#\${HOME}#$HOME#g" integration/platform.env.example > .env
          # AUTH_SECRET / AGW_VAULT_KEY have no default in docker-compose.yml
          # (${VAR:?...}) — `agentic up` generates them on first run via
          # `openssl rand -hex 32`; do the same here so `compose config` has a
          # required value to interpolate.
          printf 'AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'AGW_VAULT_KEY=%s\n' "$(openssl rand -hex 32)" >> .env

      - name: Validate docker-compose.yml
        run: docker compose -f deploy/docker-compose.yml --env-file .env config --quiet
